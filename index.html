<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Datto AV Log Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pako@2.0.3/dist/pako.min.js"></script>
    <style>
        .tab-btn.active { border-bottom: 2px solid #3b82f6; color: #1e40af; }
    </style>
</head>
<body class="bg-slate-50 p-8">
    <div class="max-w-7xl mx-auto bg-white rounded-xl shadow-lg p-6">
        <div class="mb-8 p-6 border-2 border-dashed border-slate-200 rounded-lg text-center">
            <input type="file" id="fileInput" class="hidden" onchange="handleFile(event)">
            <label for="fileInput" class="cursor-pointer bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">Upload Log Archive (.gz)</label>
        </div>

        <div class="tabs flex gap-4 border-b mb-4">
            <button class="tab-btn active p-2 font-bold" onclick="switchTab('agent-logs')">Agent Logs</button>
            <button class="tab-btn p-2 font-bold" onclick="switchTab('scan-results')">Scan Results</button>
            <button class="tab-btn p-2 font-bold" onclick="switchTab('exclusions')">Exclusions</button>
        </div>

        <div id="agent-logs" class="tab-panel">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead><tr class="bg-slate-100 text-xs uppercase font-bold text-slate-600">
                        <th class="p-2">Timestamp</th><th class="p-2">Level</th><th class="p-2">Module</th><th class="p-2">Message</th>
                    </tr></thead>
                    <tbody id="agent-table-body"></tbody>
                </table>
            </div>
        </div>
        </div>

    <div id="jsonModal" class="hidden fixed inset-0 bg-slate-900/80 flex items-center justify-center z-50">
        <div class="bg-[#0f172a] w-11/12 h-5/6 rounded-xl flex flex-col shadow-2xl">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center">
                <h3 class="text-white font-bold">Payload Detail</h3>
                <button onclick="document.getElementById('jsonModal').classList.add('hidden')" class="text-slate-400 text-2xl">&times;</button>
            </div>
            <div id="jsonModalContent" class="p-6 overflow-auto font-mono text-sm leading-relaxed"></div>
        </div>
    </div>

    <script src="parser.js"></script>
    <script src="ui.js"></script>
</body>
</html>
